<form id="problemForm">
  <label>Imię: </label>
  <input type="text" id="imie" required><br>
  
  <label>Nazwisko: </label>
  <input type="text" id="nazwisko" required><br>
  
  <label>E-Mail: </label>
  <input type="email" id="email" required><br>
  
  <label>Opis Problemu: </label>
  <input type="text" id="opis" required><br>

  <label>ID: </label>
  <input type="text" id="id_display" readonly style="background-color: #eee;"><br><br>

  <button type="submit">Wyślij zgłoszenie</button>
</form>

<script>
  let currentId = 1;

  function updateIdField() {
    document.getElementById('id_display').value = currentId;
  }

  updateIdField();

  const form = document.getElementById('problemForm');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const payload = {
      id: currentId,
      imie: document.getElementById('imie').value,
      nazwisko: document.getElementById('nazwisko').value,
      email: document.getElementById('email').value,
      opis: document.getElementById('opis').value
    };

    fetch("https://hook.eu1.make.com/3c5y57it2qcxaadb2oxypsh1h09kxv8g", {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert("Zgłoszenie wysłane!");
      currentId++;
      form.reset();
      updateIdField();
    })
    .catch(error => {
      console.error("Szczegóły błędu:", error);
      alert("Nadal występuje błąd. Sprawdź konsolę (F12).");
    });
  });
</script>
