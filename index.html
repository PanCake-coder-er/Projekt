<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Twoja Strona</title>
</head>
<body>
<h1> Formularz do zgloszen! </h1>
<form id="problemForm">
  <label>Imię: </label>
  <input type="text" id="imie" required><br>
  
  <label>Nazwisko: </label>
  <input type="text" id="nazwisko" required><br>
  
  <label>E-Mail: </label>
  <input type="email" id="email" required><br>
  
  <label>Opis Problemu: </label>
  <input type="text" id="opis" required><br>

  <label>ID: </label>
  <input type="text" id="id_display" readonly style="background-color: #eee;"><br><br>

  <button type="submit" id="submitBtn">Wyślij zgłoszenie</button>
</form>
<script src="script.js"></script>
</body>
</html>
