<!DOCTYPE html>
<html lang="pl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Twoja Strona</title>
</head>
<body>
    <h1> Formularz do zgloszen! </h1>
    <form id="problemForm">
        <label>Imię: </label>
        <input type="text" id="imie" name="imie" required><br>
        
        <label>Nazwisko: </label>
        <input type="text" id="nazwisko" name="nazwisko" required><br>
        
        <label>E-Mail: </label>
        <input type="email" id="email" name="email" required><br>
        
        <label>Opis Problemu: </label>
        <input type="text" id="opis" name="opis" required><br>

        <label>Data zgłoszenia: </label>
        <input type="text" id="data_display" name="data_stworzenia" readonly><br>

        <label>ID: </label>
        <input type="text" id="id_display" name="id" readonly><br>

        <button type="submit">Wyślij zgłoszenie</button>
    </form>
    <script src="java.js"></script>
</body>
</html>
