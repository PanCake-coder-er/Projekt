<form id="problemForm">
  <label>Imię: </label>
  <input type="text" id="imie" name="imie" required><br>
  
  <label>Nazwisko: </label>
  <input type="text" id="nazwisko" name="nazwisko" required><br>
  
  <label>E-Mail: </label>
  <input type="email" id="email" name="email" required><br>
  
  <label>Opis Problemu: </label>
  <input type="text" id="opis" name="opis" required><br>

  <label>ID: </label>
  <input type="text" id="id_display" name="id" readonly><br><br>

  <button type="submit">Wyślij zgłoszenie</button>
</form>

<script>
  let currentId = 1;

  function updateIdField() {
    document.getElementById('id_display').value = currentId;
  }

  updateIdField();

  const form = document.getElementById('problemForm');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const payload = {
      id: currentId,
      imie: document.getElementById('imie').value,
      nazwisko: document.getElementById('nazwisko').value,
      email: document.getElementById('email').value,
      opis: document.getElementById('opis').value
    };

    fetch("https://hook.eu1.make.com/3c5y57it2qcxaadb2oxypsh1h09kxv8g", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    })
    .then(response => {
      if (response.ok) {
        currentId++;
        form.reset();
        updateIdField();
      }
    })
    .catch(error => console.error(error));
  });
</script>
